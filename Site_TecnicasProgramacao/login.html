```html
<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | Prime Motors</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            font-family: Arial, Helvetica, sans-serif;

            background:
                linear-gradient(
                    rgba(17, 24, 39, 0.88),
                    rgba(17, 24, 39, 0.88)
                ),
                url("https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?auto=format&fit=crop&w=1800&q=80")
                center / cover;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;
        }


        /* CARD DE LOGIN */

        .login-card {

            width: 100%;

            max-width: 420px;

            background: #ffffff;

            border-radius: 18px;

            padding: 40px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.35);
        }


        /* LOGO */

        .logo {

            text-align: center;

            font-size: 1.8rem;

            font-weight: 800;

            color: #111827;

            margin-bottom: 8px;
        }

        .logo span {

            color: #e63946;
        }


        .subtitle {

            text-align: center;

            color: #6b7280;

            margin-bottom: 30px;
        }


        /* ÍCONE */

        .login-icon {

            width: 70px;

            height: 70px;

            margin: 0 auto 20px;

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #fee2e2;

            color: #e63946;

            font-size: 30px;
        }


        /* CAMPOS */

        .form-label {

            font-weight: 600;

            color: #374151;
        }


        .input-group-text {

            background: #f9fafb;

            border-right: none;

            color: #6b7280;
        }


        .form-control {

            min-height: 48px;

            border-left: none;

            border-radius: 0 8px 8px 0;
        }


        .input-group {

            margin-bottom: 20px;
        }


        .form-control:focus {

            box-shadow: none;

            border-color: #ced4da;
        }


        .input-group:focus-within
        .input-group-text {

            border-color: #e63946;

            color: #e63946;
        }


        /* ESQUECI SENHA */

        .forgot-password {

            color: #e63946;

            text-decoration: none;

            font-size: 0.9rem;

            font-weight: 600;
        }

        .forgot-password:hover {

            text-decoration: underline;
        }


        /* BOTÃO */

        .btn-login {

            width: 100%;

            min-height: 48px;

            border: none;

            border-radius: 8px;

            background: #e63946;

            color: white;

            font-weight: 700;

            font-size: 1rem;

            transition: 0.3s;

            margin-top: 10px;
        }


        .btn-login:hover {

            background: #c92f3b;

            transform: translateY(-1px);
        }


        /* RODAPÉ */

        .footer-text {

            text-align: center;

            margin-top: 25px;

            color: #9ca3af;

            font-size: 0.8rem;
        }


        /* RESPONSIVO */

        @media (max-width: 480px) {

            .login-card {

                padding: 30px 22px;

                border-radius: 14px;
            }

            .logo {

                font-size: 1.5rem;
            }

        }

    </style>

</head>


<body>


    <div class="login-card">


        <!-- ÍCONE -->

        <div class="login-icon">

            <i class="bi bi-person-lock"></i>

        </div>


        <!-- LOGO -->

        <div class="logo">

            PRIME<span>MOTORS</span>

        </div>


        <p class="subtitle">

            Acesso ao sistema administrativo

        </p>


        <!-- FORMULÁRIO -->

        <form>


            <!-- E-MAIL -->

            <label
                for="email"
                class="form-label">

                E-mail

            </label>


            <div class="input-group">

                <span class="input-group-text">

                    <i class="bi bi-envelope"></i>

                </span>


                <input
                    type="email"
                    id="email"
                    class="form-control"
                    placeholder="Digite seu e-mail"
                    required>

            </div>


            <!-- SENHA -->

            <label
                for="senha"
                class="form-label">

                Senha

            </label>


            <div class="input-group">

                <span class="input-group-text">

                    <i class="bi bi-lock"></i>

                </span>


                <input
                    type="password"
                    id="senha"
                    class="form-control"
                    placeholder="Digite sua senha"
                    required>

            </div>


            <!-- ESQUECI SENHA -->

            <div class="text-end mb-3">

                <a
                    href="#"
                    class="forgot-password">

                    Esqueci minha senha

                </a>

            </div>


            <!-- BOTÃO -->

            <button
                type="submit"
                class="btn-login">

                <i class="bi bi-box-arrow-in-right"></i>

                Entrar

            </button>


        </form>


        <!-- RODAPÉ -->

        <div class="footer-text">

            Sistema administrativo • Prime Motors

        </div>


    </div>


</body>

</html>
```
